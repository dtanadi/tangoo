<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#EC4899">
    <title>PandaLingo - Kids Chinese Tutor</title>
    
    <!-- Tailwind CSS for responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfbfb;
            touch-action: manipulation;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .bounce-slow {
            animation: bounceSlow 2.4s infinite ease-in-out;
        }
        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Glassmorphism & Pastel Chat Bubbles */
        .chat-bubble-ai {
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 22px 22px 22px 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            border: 2px solid #FCE7F3;
        }
        .chat-bubble-user {
            background: linear-gradient(135deg, #EC4899 0%, #F43F5E 100%);
            border-radius: 22px 22px 6px 22px;
            box-shadow: 0 6px 16px rgba(236, 72, 153, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .glass-header {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 2px solid rgba(252, 231, 243, 0.8);
        }
        .glass-footer {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 2px solid rgba(252, 231, 243, 0.9);
        }

        /* Talking Head Animation */
        .talking-head {
            animation: talk 0.22s infinite alternate ease-in-out;
        }
        @keyframes talk {
            0% { transform: scaleY(1) scaleX(1) translateY(0); }
            100% { transform: scaleY(1.09) scaleX(0.95) translateY(-4px); }
        }

        .avatar-img {
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #F472B6;
            background-color: white;
        }

        /* Custom thin scrollbar for scenario strip */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col bg-pink-50">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">

            {
                id: 'supermarket',
                icon: '🛒',
                name: 'Supermarket',
                style: 'bg-sky-100 text-sky-900 border-sky-300',
                bg: 'linear-gradient(135deg, rgba(224,242,254,0.75), rgba(240,253,244,0.75)), url(https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=1080&auto=format&fit=crop)',

            {

                bg: 'linear-gradient(135deg, rgba(236,252,203,0.75), rgba(209,250,229,0.75)), url(https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?q=80&w=1080&auto=format&fit=crop)',

            },
            {
                id: 'library',
                icon: '📚',
                name: 'Public Library',
                style: 'bg-violet-100 text-violet-900 border-violet-300',
                bg: 'linear-gradient(135deg, rgba(237,233,254,0.75), rgba(224,231,255,0.75)), url(https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1080&auto=format&fit=crop)',
                prompt: "Let's roleplay visiting the National Library (NLB)! Remind me softly to be quiet and ask what storybook I want to borrow.",

                    { hz: '书', py: 'shū', en: 'Book' },

                localReply: {

                    pinyin: 'Xū! Wǒmen zài túshūguǎn yào ānjìng ó. Nǐ xiǎng kàn shénme gùshishū?',
                    english: 'Shh! In the library we need to be quiet (安静). What kind of storybook (故事书) would you like to read (看书) today?'

            },
            {
                id: 'airport',
                icon: '✈️',
                name: 'Changi Airport',
                style: 'bg-cyan-100 text-cyan-900 border-cyan-300',
                bg: 'linear-gradient(135deg, rgba(207,250,254,0.75), rgba(224,242,254,0.75)), url(https://images.unsplash.com/photo-1544015759-224ae4a8b792?q=80&w=1080&auto=format&fit=crop)',
                prompt: "Let's roleplay visiting Jewel Changi Airport! Talk about the big waterfall and airplanes flying in the sky.",
                vocab: [
                    { hz: '飞机', py: 'fēi jī', en: 'Airplane' },
                    { hz: '水', py: 'shuǐ', en: 'Water' },

                ],
                hints: ["飞机在天上飞! (The airplane flies in the sky!)", "瀑布的水很大! (The waterfall water is huge!)", "I love Changi Airport!"],
                localReply: {

                    pinyin: 'Wā! Zhāngyí Jīchǎng de pùbù hǎo duō shuǐ! Nǐ kàndào dà fēijī le ma?',
                    english: 'Wow! The Jewel Changi Airport waterfall has so much water (水 - shuǐ)! Can you see the big (大) airplane (飞机) getting ready to fly (飞)?'
                }
            },
            {

                name: 'Merlion Park',
                style: 'bg-rose-100 text-rose-900 border-rose-300',
                bg: 'linear-gradient(135deg, rgba(255,228,230,0.75), rgba(224,242,254,0.75)), url(https://images.unsplash.com/photo-1565967511849-76a60a516170?q=80&w=1080&auto=format&fit=crop)',
                prompt: "Let's roleplay visiting Merlion Park in Singapore! Explain how the Merlion sprays water from its mouth.",

            {
                id: 'rainy',
                icon: '☔',
                name: 'Rainy Day',

                bg: 'linear-gradient(135deg, rgba(224,231,255,0.75), rgba(243,232,255,0.75)), url(https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?q=80&w=1080&auto=format&fit=crop)',
                prompt: "Let's roleplay a rainy afternoon in Singapore! Ask me if I have an umbrella before we walk home.",
                vocab: [
                    { hz: '下雨', py: 'xià yǔ', en: 'Rain' },
                    { hz: '雨伞', py: 'yǔ sǎn', en: 'Umbrella' },

                ],
                hints: ["外面下雨了! (It is raining outside!)", "我有雨伞 (I have an umbrella)", "Let's go home (我们回家吧)!"],

                    english: 'Oh my, it is raining (下雨) outside! Look at 雨 (yǔ - rain)—it looks like raindrops falling from a cloud! Did you bring an umbrella (雨伞) to go home (家)?'
                }
            }
        ];

        // Core starter words always available for quick pronunciation check
        const CORE_PRACTICE_WORDS = [
            { hz: '人', py: 'rén', en: 'Person' },
            { hz: '水', py: 'shuǐ', en: 'Water' },
            { hz: '口', py: 'kǒu', en: 'Mouth' },
            { hz: '大', py: 'dà', en: 'Big' },
            { hz: '你好', py: 'nǐ hǎo', en: 'Hello' },
            { hz: '谢谢', py: 'xiè xie', en: 'Thanks' }
        ];

        const App = () => {
            const [messages, setMessages] = useState([
                { 
                    id: 'init-1',
                    role: 'ai', 
                    chinese: '你好！我们一起学中文吧！',
                    pinyin: 'Nǐ hǎo! Wǒmen yīqǐ xué Zhōngwén ba!',
                    english: 'Hello! Let\'s learn Chinese together! Tap any green/pink word to hear it, or tap the Microphone to talk to me!'
                }
            ]);

            // Speech & Karaoke Highlighting State
            const [activeSpeechId, setActiveSpeechId] = useState(null);
            const [activeCharIndex, setActiveCharIndex] = useState(-1);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [availableVoices, setAvailableVoices] = useState([]);
            const [selectedVoiceURI, setSelectedVoiceURI] = useState('');

            // Microphone & Hybrid Recording State
            const [isRecording, setIsRecording] = useState(false);
            const [liveTranscript, setLiveTranscript] = useState('');
            const [micVolume, setMicVolume] = useState(0);
            const [micLang, setMicLang] = useState('zh-CN'); // 'zh-CN' or 'en-SG'
            const [micError, setMicError] = useState(null);
            const [textInput, setTextInput] = useState('');

            // AI & Gamification State
            const [isLoading, setIsLoading] = useState(false);
            const [bambooCount, setBambooCount] = useState(0);
            const [showRewardAnimation, setShowRewardAnimation] = useState(false);

            // Scenario & Teacher Customization State
            const [sceneId, setSceneId] = useState('default');
            const [activeScenario, setActiveScenario] = useState(SCENARIOS_DATA[0]);
            const [showSettings, setShowSettings] = useState(false);
            const [teacherName, setTeacherName] = useState('Panda');
            const [teacherPic, setTeacherPic] = useState(null);
            const [customApiKey, setCustomApiKey] = useState('');

            // Refs for managing hardware timers and streams cleanly on iPad/Android
            const chatEndRef = useRef(null);
            const karaokeTimerRef = useRef(null);
            const recognitionRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const audioChunksRef = useRef([]);
            const volumeIntervalRef = useRef(null);
            const audioContextRef = useRef(null);
            const maxRecordTimerRef = useRef(null);
            const liveTranscriptRef = useRef('');

            // Environment API key (auto-injected by Canvas, or overridden in Settings for external Netlify hosting)
            const apiKey = "";

            // Scroll to bottom when new messages arrive
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isLoading, liveTranscript, micError]);

            // Preload Mandarin voices on iPadOS / Android (voices load asynchronously)
            useEffect(() => {
                if (!window.speechSynthesis) return;

                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices() || [];
                    // Filter Chinese voices, strictly excluding Cantonese (HK/MO) so 水 (shuǐ) is always pronounced in Mandarin
                    const mandarinVoices = voices.filter(v => {
                        const lang = (v.lang || '').toLowerCase();
                        const name = (v.name || '').toLowerCase();
                        const isCantonese = lang.includes('hk') || lang.includes('mo') || lang.includes('yue') || name.includes('cantonese') || name.includes('sin-ji');
                        const isChinese = lang.includes('zh') || lang.includes('cmn') || name.includes('chinese') || name.includes('mandarin') || name.includes('ting-ting') || name.includes('meijia') || name.includes('li-mu') || name.includes('yu-shu');
                        return isChinese && !isCantonese;
                    });

                    setAvailableVoices(mandarinVoices);

                    if (!selectedVoiceURI && mandarinVoices.length > 0) {
                        // Rank voices: Enhanced/Premium Ting-Ting or zh-CN / zh-SG first
                        const best =
                            mandarinVoices.find(v => (v.lang === 'zh-CN' || v.lang === 'zh_CN') && (v.name.includes('Enhanced') || v.name.includes('Premium') || v.name.includes('Ting-Ting') || v.name.includes('Li-Mu'))) ||
                            mandarinVoices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN') ||
                            mandarinVoices.find(v => v.lang === 'zh-SG' || v.lang === 'zh_SG') ||
                            mandarinVoices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW') ||
                            mandarinVoices[0];
                        if (best) setSelectedVoiceURI(best.voiceURI);

                };

                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;

                return () => {
                    stopSpeaking();
                    cleanupMicrophone();
                };
            }, []);

            const clearKaraokeTimer = () => {
                if (karaokeTimerRef.current) {
                    clearInterval(karaokeTimerRef.current);
                    karaokeTimerRef.current = null;
                }
            };

            const stopSpeaking = () => {
                clearKaraokeTimer();
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
                setActiveSpeechId(null);
                setActiveCharIndex(-1);
            };

            // Warm up iPad Safari audio synthesis inside synchronous user click gesture
            const unlockAudioForIOS = () => {
                try {

            const speakText = (rawText, messageId = null) => {

                        voices.find(v => (v.lang === 'zh-CN' || v.lang === 'zh_CN') && !v.lang.includes('HK')) ||
                        voices.find(v => v.lang === 'zh-SG' || v.lang === 'zh_SG') ||
                        voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW') ||
                        voices.find(v => v.lang.toLowerCase().includes('zh') && !v.lang.toLowerCase().includes('hk') && !v.lang.toLowerCase().includes('mo'));
                }

                if (chosenVoice) {
                    utterance.voice = chosenVoice;
                }

                // Strictly use Standard Mandarin locale and natural 1.0 pitch so 3rd tone words like 水 (shuǐ) are never distorted!
                utterance.lang = 'zh-CN';
                utterance.rate = 0.82; // Clear, steady teacher pace for children
                utterance.pitch = 1.0; // Natural pitch preserves accurate Mandarin 4-tone contours

                let boundaryFired = false;
                const totalChars = cleanText.length;

                const startHighlightLoop = () => {
                    clearKaraokeTimer();
                    setIsSpeaking(true);
                    if (messageId) {
                        setActiveSpeechId(messageId);
                        setActiveCharIndex(0);
                    }

                    // Fallback timer for iPad Safari where Chinese voices often omit onboundary events
                    let currentIdx = 0;
                    const msPerChar = 310; // Matches rate 0.82 for Chinese characters
                    karaokeTimerRef.current = setInterval(() => {
                        if (!boundaryFired) {
                            currentIdx += 1;
                            if (currentIdx < totalChars) {
                                if (messageId) setActiveCharIndex(currentIdx);
                            } else {
                                clearKaraokeTimer();
                            }
                        }
                    }, msPerChar);
                };

                utterance.onstart = startHighlightLoop;

                utterance.onboundary = (event) => {
                    if (typeof event.charIndex === 'number' && messageId) {
                        boundaryFired = true;
                        setActiveCharIndex(event.charIndex);
                    }
                };

                utterance.onend = () => {
                    clearKaraokeTimer();
                    setIsSpeaking(false);
                    setActiveSpeechId(null);
                    setActiveCharIndex(-1);
                };

                utterance.onerror = () => {
                    clearKaraokeTimer();
                    setIsSpeaking(false);
                    setActiveSpeechId(null);
                    setActiveCharIndex(-1);
                };

            };

            const awardBamboo = () => {
                setBambooCount(prev => prev + 1);
                setShowRewardAnimation(true);
                setTimeout(() => setShowRewardAnimation(false), 2000);
            };

            // Smart local tutor fallback so the app works even if tested offline or without an API key
            const generateLocalTutorResponse = (userText) => {
                const currentScen = activeScenario || SCENARIOS_DATA[0];
                const randomVocab = currentScen.vocab[Math.floor(Math.random() * currentScen.vocab.length)];
                
                // Check if user mentioned specific words
                if (userText && userText.includes('水')) {
                    return {
                        chinese: '太棒了！水，shuǐ，我们要多喝水哦！你还想学什么词？',
                        pinyin: 'Tài bàng le! Shuǐ, wǒmen yào duō hē shuǐ ó! Nǐ hái xiǎng xué shénme cí?',
                        english: 'Awesome job saying 水 (shuǐ - water)! Notice how 水 looks like a flowing river with splashes on both sides! What else would you like to try saying?',
                        bambooEarned: true
                    };
                }
                if (userText && userText.includes('人')) {
                    return {
                        chinese: '读得很准！人，rén，就像两条腿在走路！我们继续练习吧！',
                        pinyin: 'Dú de hěn zhǔn! Rén, jiù xiàng liǎng tiáo tuǐ zài zǒulù! Wǒmen jìxù liànxí ba!',
                        english: 'Great pronunciation of 人 (rén - person)! It looks just like two legs walking! Let\'s keep practicing!',
                        bambooEarned: true
                    };
                }

                return {
                    chinese: `太棒了！我们一起来读：${randomVocab.hz}。你喜欢${randomVocab.hz}吗？`,
                    pinyin: `Tài bàng le! Wǒmen yīqǐ lái dú: ${randomVocab.py}. Nǐ xǐhuān ${randomVocab.py} ma?`,
                    english: `Well done! In our ${currentScen.name} adventure, let's practice "${randomVocab.hz}" (${randomVocab.py} - ${randomVocab.en}). Can you try saying "${randomVocab.hz}" out loud?`,
                    bambooEarned: true
                };
            };

            // Helper for exponential backoff fetch calls
            const fetchWithRetry = async (url, options, retries = 2) => {
                for (let i = 0; i <= retries; i++) {
                    try {
                        const res = await fetch(url, options);
                        if (res.ok) return await res.json();
                        if (res.status >= 400 && res.status < 500 && res.status !== 429) {
                            throw new Error(`API status ${res.status}`);

                    } catch (err) {
                        if (i === retries) throw err;
                        await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));

            };

            const sendToAI = async ({ userText = '', audioBase64 = null, audioMimeType = 'audio/mp4', tempMsgId = null }) => {
                setIsLoading(true);
                const effectiveKey = customApiKey.trim() || apiKey;
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${effectiveKey}`;

                const chatHistory = messages.slice(-8).map(m => ({
                    role: m.role === 'ai' ? 'model' : 'user',
                    parts: [{ text: m.role === 'ai' ? `${m.chinese || ''} (${m.english || ''})` : (m.text || '') }]
                }));

                if (audioBase64) {

                            mimeType: audioMimeType,
                            data: audioBase64
                        }

                        text: userText
                            ? `The child spoke into the microphone (draft transcript: "${userText}"). Listen to the audio, transcribe what the child said into heardText, and reply as their encouraging Chinese tutor.`
                            : `The child spoke into the microphone in English or Mandarin Chinese. Listen carefully to the audio, transcribe what the child said into heardText, and reply as their encouraging Chinese tutor.`
                    });
                } else {
                    userParts.push({ text: userText });
                }

                chatHistory.push({ role: 'user', parts: userParts });

                const scenarioContext = activeScenario
                    ? `Current Singapore Scenario: ${activeScenario.name}. Target words: ${activeScenario.vocab.map(v => `${v.hz} (${v.py} - ${v.en})`).join(', ')}.`
                    : 'General Chat';

                const systemPrompt = `You are an enthusiastic, warm Chinese tutor named ${teacherName} teaching Mandarin Chinese to a 6-8 year old lower primary student in Singapore.
                ${scenarioContext}

                Follow these pedagogical rules:
                1. Guided Roleplay: Keep the conversation natural, cheerful, and step-by-step.
                2. Contextual Vocabulary: Use simple Mandarin phrases suitable for lower primary kids.
                3. Visual Character Mnemonics: Briefly mention a fun visual tip for 1 character when helpful (e.g., "水 looks like splashing water!", "口 looks like an open mouth!", "人 looks like two legs walking!").
                4. Always end with a simple, fun question to invite the child to reply!

                Respond ONLY in JSON matching the exact schema.`;

                const payload = {
                    contents: chatHistory,
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                heardText: { type: "STRING" },
                                chinese: { type: "STRING" },
                                pinyin: { type: "STRING" },
                                english: { type: "STRING" },
                                bambooEarned: { type: "BOOLEAN" }
                            },
                            propertyOrdering: ["heardText", "chinese", "pinyin", "english", "bambooEarned"]
                        }
                    }
                };

                    const result = await fetchWithRetry(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },

                    if (tempMsgId) {

                    setMessages(prev => [...prev, {
                        id: newMsgId,
                        role: 'ai',
                        chinese: parsed.chinese,
                        pinyin: parsed.pinyin,
                        english: parsed.english

                    }

                    const fallbackText = userText || 'Hello!';
                    if (tempMsgId) {
                        setMessages(prev => prev.map(m => m.id === tempMsgId ? { ...m, text: userText || '🎤 我说了中文! (I spoke to teacher!)' } : m));
                    }
                    const fallback = generateLocalTutorResponse(fallbackText);
                    awardBamboo();
                    const newMsgId = 'msg-' + Date.now();
                    setMessages(prev => [...prev, {
                        id: newMsgId,
                        role: 'ai',
                        chinese: fallback.chinese,
                        pinyin: fallback.pinyin,

            const cleanupMicrophone = () => {

                        recognitionRef.current.onend = null;
                        recognitionRef.current.onerror = null;
                        recognitionRef.current.stop();
                    } catch (e) {}
                    recognitionRef.current = null;
                }

                    mediaStreamRef.current.getTracks().forEach(track => track.stop());

                }

                    reader.readAsDataURL(blob);

                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {

                        return;
                    } catch (e) {
                        console.warn("MediaRecorder stop error:", e);
                    }
                }

                cleanupMicrophone();
                setLiveTranscript('');
                liveTranscriptRef.current = '';

                    setMessages(prev => [...prev, { id: userMsgId, role: 'user', text: capturedText }]);

                        recognition.lang = micLang; // 'zh-CN' or 'en-SG'
                        recognition.interimResults = true;
                        recognition.continuous = true;

                            let combined = '';
                            for (let i = 0; i < event.results.length; i++) {

                            }

                                setLiveTranscript(combined.trim());
                            }

                            if (standaloneMode) {

                                cleanupMicrophone();
                                setLiveTranscript('');
                                liveTranscriptRef.current = '';

                                            mediaRecorderRef.current.stop();
                                        } catch (e) {}

                                    userText: draftText,
                                    audioBase64: base64Audio,
                                    audioMimeType: actualMime,
                                    tempMsgId: tempId
                                });
                            } catch (err) {
                                if (draftText) {
                                    await sendToAI({ userText: draftText, tempMsgId: tempId });

                        maxRecordTimerRef.current = setTimeout(() => {

                );
            };

            const handleScenario = (scenarioObj) => {
                unlockAudioForIOS();
                setSceneId(scenarioObj.id);
                setActiveScenario(scenarioObj);
                setMicError(null);

                const userMsgId = 'usr-' + Date.now();
                const aiMsgId = 'ai-' + (Date.now() + 1);

                // Instant response using curated Singapore scenario greeting so the child never waits when switching scenes!
                setMessages(prev => [
                    ...prev,
                    { id: userMsgId, role: 'user', text: `${scenarioObj.icon} Let's practice: ${scenarioObj.name}!` },
                    {
                        id: aiMsgId,

                        chinese: scenarioObj.localReply.chinese,

                    }

                unlockAudioForIOS();
                setMicError(null);
                const msgId = 'usr-' + Date.now();
                setMessages(prev => [...prev, { id: msgId, role: 'user', text: hintText }]);

                setMessages(prev => [...prev, { id: 'usr-' + Date.now(), role: 'user', text: trimmed }]);

            const currentBg = activeScenario?.bg || 'linear-gradient(135deg, #fbcfe8 0%, #fef08a 100%)';

                <div 
                    className="flex flex-col h-full max-w-2xl mx-auto w-full shadow-2xl relative transition-all duration-700 ease-in-out overflow-hidden"
                    style={{ backgroundImage: currentBg, backgroundSize: 'cover', backgroundPosition: 'center' }}
                >
                    {/* Soft pastel backdrop layer for high legibility */}
                    <div className="absolute inset-0 bg-white/55 backdrop-blur-[2px] z-0 pointer-events-none"></div>

                    <div className="relative z-10 flex flex-col h-full overflow-hidden">
                        {/* Header Bar */}
                        <div className="glass-header text-gray-800 px-4 py-2.5 rounded-b-3xl shadow-sm flex justify-between items-center z-20 flex-shrink-0">
                            <div className="flex items-center gap-2.5">
                                <div className={isSpeaking ? "talking-head" : "bounce-slow"}>
                                    {teacherPic ? (
                                        <img src={teacherPic} alt="Teacher" className="avatar-img w-11 h-11" />
                                    ) : (
                                        <div className="text-4xl">🐼</div>
                                    )}
                                </div>
                                <div>
                                    <h1 className="text-lg md:text-xl font-black tracking-wide text-pink-600 leading-tight">
                                        {teacherName}Lingo
                                    </h1>
                                    <p className="text-[11px] font-bold text-gray-500">
                                        Singapore Kids Mandarin Tutor
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                {/* Quick Core Word Pronouncer (人 & 水) */}
                                <div className="hidden sm:flex items-center gap-1 bg-emerald-50/90 px-2.5 py-1 rounded-full border border-emerald-200">
                                    <span className="text-[11px] font-extrabold text-emerald-700 mr-1">Quick Tap:</span>
                                    {CORE_PRACTICE_WORDS.slice(0, 4).map((cw, i) => (
                                        <button
                                            key={i}
                                            onClick={() => handleVocabClick(cw)}
                                            className="bg-white hover:bg-emerald-100 text-emerald-800 text-xs font-black px-2 py-0.5 rounded-full border border-emerald-200 shadow-sm active:scale-90 transition-transform"
                                            title={`Hear ${cw.hz} (${cw.py})`}
                                        >
                                            🔊 {cw.hz}
                                        </button>
                                    ))}
                                </div>

                                {/* Bamboo Reward Counter */}
                                <div className="bg-white/90 rounded-full px-3 py-1 flex items-center gap-1 border-2 border-pink-200 text-pink-600 shadow-sm">
                                    <span className="text-base font-black">{bambooCount}</span>
                                    <span className="text-lg">🎋</span>
                                </div>
                                
                                {/* Settings Gear Button */}
                                <button
                                    onClick={() => setShowSettings(true)}
                                    className="bg-white/90 hover:bg-white w-9 h-9 rounded-full flex items-center justify-center transition-colors text-gray-500 hover:text-pink-500 shadow-sm border border-pink-100"
                                    aria-label="Settings"
                                >
                                    <i className="fa-solid fa-gear"></i>
                                </button>
                            </div>

                            {/* Reward Animation Overlay */}
                            {showRewardAnimation && (
                                <div className="absolute right-10 top-12 text-5xl pop-in z-50 pointer-events-none">
                                    🎋✨
                                </div>
                            )}
                        </div>

                        {/* 11 Singapore Contextual Scenarios Strip */}
                        <div className="flex gap-2 px-3 py-2 overflow-x-auto no-scrollbar snap-x z-20 flex-shrink-0">
                            {SCENARIOS_DATA.map((scen) => {
                                const isSelected = activeScenario?.id === scen.id;
                                return (
                                    <button 
                                        key={scen.id}
                                        onClick={() => handleScenario(scen)} 
                                        className={`flex-shrink-0 snap-center font-extrabold text-xs md:text-sm py-2 px-3.5 rounded-2xl shadow-sm active:scale-95 transition-all border-b-4 ${scen.style} ${isSelected ? 'ring-2 ring-pink-500 scale-105' : 'opacity-90 hover:opacity-100'}`}
                                    >
                                        {scen.icon} {scen.name}
                                    </button>
                                );
                            })}
                        </div>

                        {/* Settings & Voice Configuration Modal */}
                        {showSettings && (
                            <div className="absolute inset-0 bg-black/45 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-3xl p-5 w-full max-w-md shadow-2xl pop-in border-4 border-pink-100 max-h-[90vh] overflow-y-auto">
                                    <div className="flex justify-between items-center mb-3">
                                        <h2 className="text-xl font-black text-pink-600">Teacher & Voice Settings</h2>
                                        <button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-red-500 text-2xl px-2">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                    
                                    <div className="space-y-4 text-sm">
                                        <div>
                                            <label className="block text-gray-700 font-extrabold mb-1">Teacher Name</label>
                                            <input 
                                                type="text" 
                                                value={teacherName} 
                                                onChange={(e) => setTeacherName(e.target.value)}
                                                className="w-full px-3.5 py-2 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 bg-pink-50/50 font-bold"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-gray-700 font-extrabold mb-1">Teacher Photo (Talking Head)</label>
                                            <div className="flex items-center gap-3">
                                                {teacherPic ? (
                                                    <img src={teacherPic} alt="Preview" className="w-14 h-14 avatar-img border-pink-400" />
                                                ) : (
                                                    <div className="w-14 h-14 bg-pink-50 rounded-full flex items-center justify-center text-3xl border-2 border-dashed border-pink-200">🐼</div>
                                                )}
                                                <label className="bg-pink-100 text-pink-700 px-3.5 py-2 rounded-xl font-extrabold cursor-pointer hover:bg-pink-200 transition-colors">
                                                    Upload Face Photo
                                                    <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                                                </label>
                                                {teacherPic && (
                                                    <button onClick={() => setTeacherPic(null)} className="text-xs text-red-500 font-bold underline">
                                                        Reset
                                                    </button>
                                                )}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-gray-700 font-extrabold mb-1">
                                                Mandarin Voice ({availableVoices.length} detected)
                                            </label>
                                            <select
                                                value={selectedVoiceURI}
                                                onChange={(e) => setSelectedVoiceURI(e.target.value)}
                                                className="w-full px-3 py-2 border-2 border-pink-100 rounded-xl bg-pink-50/50 font-bold text-gray-700"
                                            >
                                                {availableVoices.length === 0 && (
                                                    <option value="">System Default Mandarin (zh-CN)</option>
                                                )}
                                                {availableVoices.map((v, i) => (
                                                    <option key={i} value={v.voiceURI}>
                                                        {v.name} ({v.lang})
                                                    </option>
                                                ))}
                                            </select>
                                            <div className="flex gap-2 mt-2">
                                                <button
                                                    type="button"
                                                    onClick={() => speakText('人，水，你好！', null)}
                                                    className="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-extrabold px-3 py-1.5 rounded-xl text-xs transition-colors"
                                                >
                                                    🔊 Test "人 (rén)" & "水 (shuǐ)"
                                                </button>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-gray-700 font-extrabold mb-1">
                                                Optional Gemini API Key (For external Netlify/GitHub hosting)
                                            </label>
                                            <input 
                                                type="password" 
                                                placeholder="Leave blank in Canvas preview"
                                                value={customApiKey} 
                                                onChange={(e) => setCustomApiKey(e.target.value)}
                                                className="w-full px-3.5 py-2 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-pink-400 bg-gray-50 text-xs"
                                            />
                                        </div>
                                        
                                        <button
                                            onClick={() => setShowSettings(false)}
                                            className="w-full bg-pink-500 text-white font-black text-base py-2.5 rounded-xl shadow-md hover:bg-pink-600 transition-colors"
                                        >
                                            Save & Continue!
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        <div className="flex-1 overflow-y-auto px-3.5 py-3 space-y-4 z-10">
                            {messages.map((msg, idx) => {
                                const isSpeakingThisMsg = activeSpeechId === msg.id && isSpeaking;
                                return (
                                    <div key={msg.id || idx} className={`flex ${msg.role === 'ai' ? 'justify-start' : 'justify-end'} items-end`}>
                                        {msg.role === 'ai' && (
                                            <div className="mr-2 mb-1 flex-shrink-0">
                                                <div className={isSpeakingThisMsg ? "talking-head" : ""}>
                                                    {renderAvatar()}
                                                </div>
                                            </div>
                                        )}
                                        <div className={`p-3.5 max-w-[85%] leading-relaxed ${msg.role === 'ai' ? 'chat-bubble-ai text-gray-800' : 'chat-bubble-user text-white font-extrabold text-base md:text-lg'}`}>
                                            {msg.role === 'user' ? (
                                                <div>{msg.text}</div>
                                            ) : (
                                                <div className="flex flex-col gap-1.5">
                                                    {/* Chinese Characters with Karaoke Highlighting + Click-to-Hear Character */}
                                                    {msg.chinese && (
                                                        <div className="text-2xl md:text-3xl font-black tracking-wide leading-snug text-gray-800 flex flex-wrap items-center gap-y-1">
                                                            {Array.from(msg.chinese).map((char, cIdx) => {
                                                                const isRead = isSpeakingThisMsg && cIdx < activeCharIndex;
                                                                const isCurrent = isSpeakingThisMsg && (cIdx === activeCharIndex || cIdx === activeCharIndex + 1);
                                                                
                                                                let charClass = "cursor-pointer rounded px-0.5 transition-all duration-150 hover:bg-pink-100 ";
                                                                if (isSpeakingThisMsg) {
                                                                    if (isCurrent) {
                                                                        charClass += "text-pink-600 bg-yellow-300 scale-115 shadow-sm -translate-y-0.5";
                                                                    } else if (isRead) {
                                                                        charClass += "text-pink-400";
                                                                    }
                                                                }
                                                                return (
                                                                    <span
                                                                        key={cIdx}
                                                                        onClick={() => speakText(char, null)}
                                                                        title={`Tap to hear "${char}"`}
                                                                        className={charClass}
                                                                    >
                                                                        {char}
                                                                    </span>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                    
                                                    {/* Pinyin & English Translation */}
                                                    {msg.pinyin && (
                                                        <div className="text-sm md:text-base text-pink-600 font-extrabold tracking-wide">
                                                            {msg.pinyin}
                                                        </div>
                                                    )}
                                                    {msg.english && (
                                                        <div className="text-sm md:text-base text-gray-600 font-semibold leading-snug">
                                                            {msg.english}
                                                        </div>
                                                    )}
                                                    
                                                    {/* Replay Full Sentence Audio Button */}
                                                    {msg.chinese && (
                                                        <div className="flex items-center gap-2 mt-1">
                                                            <button
                                                                onClick={() => speakText(msg.chinese, msg.id)}
                                                                className="bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-full px-3 py-1 text-xs font-extrabold flex items-center gap-1.5 transition-colors shadow-sm border border-pink-200 active:scale-95"
                                                            >
                                                                <i className="fa-solid fa-volume-high"></i>
                                                                {isSpeakingThisMsg ? 'Speaking...' : 'Listen Again'}
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            
                            {isLoading && (
                                <div className="flex justify-start items-end">
                                    <div className="mr-2 mb-1">
                                        {renderAvatar()}
                                    </div>
                                    <div className="chat-bubble-ai px-4 py-3 text-gray-400 flex items-center gap-2">
                                        <div className="w-2.5 h-2.5 bg-pink-400 rounded-full animate-bounce"></div>
                                        <div className="w-2.5 h-2.5 bg-pink-400 rounded-full animate-bounce" style={{animationDelay: '0.15s'}}></div>
                                        <div className="w-2.5 h-2.5 bg-pink-400 rounded-full animate-bounce" style={{animationDelay: '0.3s'}}></div>
                                        <span className="text-xs font-bold text-pink-500 ml-1">{teacherName} is thinking...</span>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        {}
                        {activeScenario && (
                            <div className="mx-3 mb-2 bg-white/92 backdrop-blur-md border-2 border-pink-200 rounded-2xl p-2.5 shadow-md z-20 flex-shrink-0">
                                <div className="flex flex-col gap-2">
                                    {/* Target Words (Tap any word to hear accurate Mandarin pronunciation!) */}
                                    <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                                        <span className="text-xs font-black text-pink-600 uppercase whitespace-nowrap mr-1">
                                            📚 Tap Word:
                                        </span>
                                        {activeScenario.vocab.map((v, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleVocabClick(v)}
                                                className="flex-shrink-0 bg-pink-50 hover:bg-pink-100 active:scale-95 text-gray-800 px-2.5 py-1 rounded-xl text-xs border border-pink-200 font-extrabold transition-all flex items-center gap-1 shadow-sm"
                                            >
                                                <i className="fa-solid fa-volume-high text-pink-500 text-[10px]"></i>
                                                <span className="text-sm text-pink-700">{v.hz}</span>
                                                <span className="text-gray-500">({v.py})</span>
                                                <span className="text-gray-600">- {v.en}</span>
                                            </button>
                                        ))}
                                    </div>
                                    
                                    {/* One-Tap "Try Saying" Conversation Starters */}
                                    <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-1 border-t border-pink-100">
                                        <span className="text-xs font-black text-sky-600 uppercase whitespace-nowrap mr-1">
                                            💡 Try Saying:
                                        </span>
                                        {activeScenario.hints.map((hint, i) => (
                                            <button 
                                                key={i} 
                                                onClick={() => handleHintClick(hint)}
                                                disabled={isLoading}
                                                className="flex-shrink-0 bg-sky-50 hover:bg-sky-100 text-sky-800 px-2.5 py-1 rounded-xl text-xs border border-sky-200 font-extrabold transition-all active:scale-95 shadow-sm"
                                            >
                                                "{hint}"
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        <div className="glass-footer px-4 py-3 rounded-t-3xl shadow-[0_-8px_20px_rgba(0,0,0,0.04)] flex flex-col items-center z-20 flex-shrink-0">
                            
                            {/* On-Screen Diagnostic Banner if Mic Permission Needs Attention */}
                            {micError && (
                                <div className="w-full mb-2 bg-amber-50 border-2 border-amber-300 text-amber-900 rounded-xl px-3 py-2 text-xs font-bold flex items-center justify-between gap-2 pop-in">
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-circle-info text-amber-500 text-base"></i>
                                        <span>{micError}</span>
                                    </div>
                                    <button onClick={() => setMicError(null)} className="text-amber-600 hover:text-amber-900 px-1">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            )}

                            {/* Live Recording Status & Sound Wave Meter */}
                            {isRecording && (
                                <div className="w-full mb-2 bg-rose-50 border-2 border-rose-200 rounded-xl px-3 py-1.5 flex items-center justify-between pop-in">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                                        <span className="text-xs font-black text-rose-700 truncate max-w-[200px] sm:max-w-xs">
                                            {liveTranscript ? `"${liveTranscript}"` : 'Listening... Speak now & tap Stop when done!'}
                                        </span>
                                    </div>
                                    {/* Live Volume Bars */}
                                    <div className="flex items-end gap-1 h-4">
                                        {[0.4, 0.7, 1.0, 0.8, 0.5].map((mult, idx) => {
                                            const barHeight = Math.max(4, Math.min(16, Math.round((micVolume * mult) / 5)));
                                            return (
                                                <div
                                                    key={idx}
                                                    style={{ height: `${barHeight}px` }}
                                                    className="w-1 bg-rose-500 rounded-full transition-all duration-75"
                                                ></div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* Main Control Row: Language Toggle + Giant Mic Button + Type-to-Talk Input */}
                            <div className="w-full flex items-center gap-2.5">
                                {/* Mic Recognition Language Toggle */}
                                <button
                                    type="button"
                                    onClick={() => setMicLang(prev => prev === 'zh-CN' ? 'en-SG' : 'zh-CN')}
                                    className="flex-shrink-0 bg-pink-50 hover:bg-pink-100 text-pink-700 border-2 border-pink-200 rounded-2xl px-2.5 py-2 text-xs font-black flex flex-col items-center justify-center shadow-sm active:scale-95 transition-transform"
                                    title="Switch primary listening language"
                                >
                                    <span className="text-[10px] text-gray-400 uppercase">Mic Mode</span>
                                    <span>{micLang === 'zh-CN' ? '🇨🇳 中文+EN' : '🇸🇬 EN+中文'}</span>
                                </button>

                                {/* Giant Tap-to-Talk / Tap-to-Stop Microphone Button */}
                                <button 
                                    type="button"
                                    onClick={handleMicToggle}
                                    disabled={isLoading}
                                    className={`flex-shrink-0 w-16 h-16 rounded-full flex flex-col items-center justify-center shadow-lg transition-all duration-200 active:scale-90 border-4 border-white ${
                                        isRecording
                                            ? 'bg-red-500 text-white animate-pulse shadow-red-300'
                                            : 'bg-gradient-to-br from-pink-500 to-rose-500 text-white shadow-pink-200 hover:from-pink-600 hover:to-rose-600'
                                    } ${isLoading ? 'opacity-50 cursor-not-allowed' : ''}`}
                                >
                                    <i className={`fa-solid ${isRecording ? 'fa-stop text-xl' : 'fa-microphone text-2xl'}`}></i>
                                    <span className="text-[9px] font-black uppercase tracking-wider mt-0.5">
                                        {isRecording ? 'Stop' : 'Speak'}
                                    </span>
                                </button>

                                {/* Always-Accessible Type-to-Talk Input (Works even if iPad mic permission is off) */}
                                <form onSubmit={handleTextSubmit} className="flex-1 flex items-center gap-1.5">
                                    <input
                                        type="text"
                                        value={textInput}
                                        onChange={(e) => setTextInput(e.target.value)}
                                        placeholder={`Or type to ${teacherName} here...`}
                                        disabled={isLoading}
                                        className="w-full px-3.5 py-2.5 rounded-2xl border-2 border-pink-200 bg-white/95 text-sm font-bold text-gray-700 focus:outline-none focus:border-pink-400 shadow-inner"
                                    />
                                    <button
                                        type="submit"
                                        disabled={!textInput.trim() || isLoading}
                                        className="flex-shrink-0 bg-pink-500 hover:bg-pink-600 disabled:bg-pink-200 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-sm transition-colors active:scale-95"
                                        aria-label="Send message"
                                    >
                                        <i className="fa-solid fa-paper-plane text-sm"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
