    <!-- FontAwesome for Icons -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfbfb;
            touch-action: manipulation;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .bounce-slow {
            animation: bounceSlow 2.4s infinite ease-in-out;
        }
        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Glassmorphism & Pastel Chat Bubbles */
        .chat-bubble-ai {
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 22px 22px 22px 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            border: 2px solid #FCE7F3;
        }
        .chat-bubble-user {
            background: linear-gradient(135deg, #EC4899 0%, #F43F5E 100%);
            border-radius: 22px 22px 6px 22px;
            box-shadow: 0 6px 16px rgba(236, 72, 153, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .glass-header {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 2px solid rgba(252, 231, 243, 0.8);
        }
        .glass-footer {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 2px solid rgba(252, 231, 243, 0.9);
        }

        /* Talking Head Animation */
        .talking-head {
            animation: talk 0.22s infinite alternate ease-in-out;
        }
        @keyframes talk {
            0% { transform: scaleY(1) scaleX(1) translateY(0); }
            100% { transform: scaleY(1.09) scaleX(0.95) translateY(-4px); }
        }

        .avatar-img {
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #F472B6;
            background-color: white;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

            // Environment API key (auto-injected by Canvas)
            const apiKey = "";

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isLoading, liveTranscript, micError]);

            useEffect(() => {
                if (!window.speechSynthesis) return;

                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices() || [];
                    const mandarinVoices = voices.filter(v => {
                        const lang = (v.lang || '').toLowerCase();
                        const name = (v.name || '').toLowerCase();
                        const isCantonese = lang.includes('hk') || lang.includes('mo') || lang.includes('yue') || name.includes('cantonese') || name.includes('sin-ji');
                        const isChinese = lang.includes('zh') || lang.includes('cmn') || name.includes('chinese') || name.includes('mandarin') || name.includes('ting-ting') || name.includes('meijia') || name.includes('li-mu') || name.includes('yu-shu');
                        return isChinese && !isCantonese;
                    });

                    setAvailableVoices(mandarinVoices);

                    if (!selectedVoiceURI && mandarinVoices.length > 0) {
                        const best =
                            mandarinVoices.find(v => (v.lang === 'zh-CN' || v.lang === 'zh_CN') && (v.name.includes('Enhanced') || v.name.includes('Premium') || v.name.includes('Ting-Ting') || v.name.includes('Li-Mu'))) ||
                            mandarinVoices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN') ||
                            mandarinVoices.find(v => v.lang === 'zh-SG' || v.lang === 'zh_SG') ||
                            mandarinVoices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW') ||

                    cleanupMicrophone();

                stopSpeaking();

                const cleanText = rawText.trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                window.__activeUtterance = utterance;

                const voices = window.speechSynthesis.getVoices() || [];
                let chosenVoice = voices.find(v => v.voiceURI === selectedVoiceURI);

                if (!chosenVoice) {
                    chosenVoice =
                        voices.find(v => (v.lang === 'zh-CN' || v.lang === 'zh_CN') && !v.lang.includes('HK')) ||
                        voices.find(v => v.lang === 'zh-SG' || v.lang === 'zh_SG') ||
                        voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW') ||
                        voices.find(v => v.lang.toLowerCase().includes('zh') && !v.lang.toLowerCase().includes('hk') && !v.lang.toLowerCase().includes('mo'));
                }

                if (chosenVoice) {
                    utterance.voice = chosenVoice;
                }

                utterance.lang = 'zh-CN';
                utterance.rate = 0.84;
                utterance.pitch = 1.0; // Natural pitch preserves accurate 3rd tone (e.g. 水 shuǐ)

                let boundaryFired = false;
                const totalChars = cleanText.length;

                const startHighlightLoop = () => {
                    clearKaraokeTimer();
                    setIsSpeaking(true);
                    if (messageId) {
                        setActiveSpeechId(messageId);
                        setActiveCharIndex(0);
                    }

                    let currentIdx = 0;
                    const msPerChar = 300;
                    karaokeTimerRef.current = setInterval(() => {
                        if (!boundaryFired) {
                            currentIdx += 1;
                            if (currentIdx < totalChars) {
                                if (messageId) setActiveCharIndex(currentIdx);
                            } else {
                                clearKaraokeTimer();
                            }
                        }
                    }, msPerChar);
                };

                utterance.onstart = startHighlightLoop;

                utterance.onboundary = (event) => {
                    if (typeof event.charIndex === 'number' && messageId) {
                        boundaryFired = true;
                        setActiveCharIndex(event.charIndex);
                    }
                };

                utterance.onend = () => {
                    clearKaraokeTimer();
                    setIsSpeaking(false);
                    setActiveSpeechId(null);
                    setActiveCharIndex(-1);
                };

                utterance.onerror = () => {
                    clearKaraokeTimer();
                    setIsSpeaking(false);
                    setActiveSpeechId(null);
                    setActiveCharIndex(-1);
                };

            };

            const awardBamboo = () => {
                setBambooCount(prev => prev + 1);
                setShowRewardAnimation(true);
                setTimeout(() => setShowRewardAnimation(false), 2000);
            };

            const extractJsonObject = (rawText) => {
                if (!rawText) throw new Error("Empty model output");
                const cleaned = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                try {
                    return JSON.parse(cleaned);
                } catch (e) {
                    const firstBrace = cleaned.indexOf('{');
                    const lastBrace = cleaned.lastIndexOf('}');
                    if (firstBrace !== -1 && lastBrace > firstBrace) {
                        return JSON.parse(cleaned.slice(firstBrace, lastBrace + 1));
                    }
                    throw e;
                }
            };

            const buildSystemPrompt = (scen, modeId) => {
                const modeObj = CONVERSATION_MODES.find(m => m.id === modeId) || CONVERSATION_MODES[0];
                return `You are ${teacherName}, a witty, warm, and deeply engaging bilingual Mandarin Chinese tutor for a 6-9 year old child in Singapore.
Current Setting: ${scen.name} (${scen.icon}).
Conversation Style: ${modeObj.label} — ${modeObj.instruction}

CRITICAL RULES TO PREVENT MONOTONOUS CONVERSATION:
1. NEVER use generic, repetitive praise templates every turn. React specifically and playfully to the exact meaning of what the child just said!
2. Keep the story or topic moving forward: introduce a funny mini-event, a choice between two silly or exciting things, a sound effect (e.g. 轰隆隆, 喵呜, 叮咚), or a playful riddle.
3. Speak natural, vivid Mandarin in "chinese" (1 to 2 lively sentences), with accurate full "pinyin", and a warm, natural "english" translation.
4. Provide 1 short visual character memory trick or fun discovery in "mnemonic" (e.g. "🔥 火 (huǒ - fire) looks like flames dancing upward!").
5. Generate 3 brand-new, natural follow-up phrases in "nextReplies" that the child can click or say next to answer your specific question (format: "中文句子! (English meaning)").
6. Optionally include 1 or 2 fresh vocabulary words from your reply in "newVocab" ({ "hz": "...", "py": "...", "en": "..." }).

Respond strictly in valid JSON with this exact structure:
{
  "heardText": "transcription if audio was sent, else repeat user text",
  "mood": "single expressive emoji like 🤩, 🥳, 🧐, 😮, or 😄",
  "chinese": "Vivid Mandarin reply",
  "pinyin": "Accurate Pinyin with tone marks",
  "english": "Natural English translation",
  "mnemonic": "Fun character visual tip or mini cultural fact",
  "nextReplies": [
    "Option 1 in Chinese! (English)",
    "Option 2 in Chinese! (English)",
    "Option 3 in Chinese! (English)"
  ],
  "newVocab": [
    { "hz": "词语", "py": "cí yǔ", "en": "Word meaning" }
  ],
  "bambooEarned": true
}`;
            };

            // Call OpenAI-Compatible Open Model Endpoint (OpenRouter, Groq, DeepSeek, OpenAI, or Zero-Key Pollinations Cloud)
            const callOpenAICompatibleModel = async ({ endpointUrl, modelName, bearerKey, systemPrompt, historyMessages, userPromptText }) => {
                const formattedMessages = [
                    { role: 'system', content: systemPrompt },
                    ...historyMessages.map(m => ({
                        role: m.role === 'ai' ? 'assistant' : 'user',
                        content: m.role === 'ai'
                            ? JSON.stringify({ chinese: m.chinese, pinyin: m.pinyin, english: m.english })
                            : (m.text || '')
                    })),
                    { role: 'user', content: userPromptText }
                ];

                const headers = { 'Content-Type': 'application/json' };
                if (bearerKey) {
                    headers['Authorization'] = `Bearer ${bearerKey}`;
                }

                const res = await fetch(endpointUrl, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        model: modelName,
                        messages: formattedMessages,
                        temperature: 0.85,
                        response_format: { type: 'json_object' }
                    })
                });

                if (!res.ok) {
                    throw new Error(`Open model HTTP ${res.status}`);
                }

                const data = await res.json();
                const rawContent = data?.choices?.[0]?.message?.content || '';
                return extractJsonObject(rawContent);
            };

            // Call Gemini 3 Flash API (Supports native multimodal audio + structured JSON schema)
            const callGeminiModel = async ({ geminiKey, systemPrompt, historyMessages, userPromptText, audioBase64, audioMimeType }) => {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiKey}`;

                const chatHistory = historyMessages.map(m => ({
                    role: m.role === 'ai' ? 'model' : 'user',
                    parts: [{ text: m.role === 'ai' ? `${m.chinese || ''} (${m.english || ''})` : (m.text || '') }]
                }));

                const userParts = [];
                if (audioBase64) {
                    userParts.push({
                        inlineData: {
                            mimeType: audioMimeType,
                            data: audioBase64
                        }
                    });
                    userParts.push({
                        text: userPromptText
                            ? `The child spoke into the microphone (draft transcript: "${userPromptText}"). Transcribe what the child said into heardText and respond naturally as their Chinese tutor.`
                            : `The child spoke into the microphone in Mandarin or English. Transcribe what they said into heardText and respond naturally as their Chinese tutor.`
                    });
                } else {
                    userParts.push({ text: userPromptText });
                }

                chatHistory.push({ role: 'user', parts: userParts });

                const payload = {
                    contents: chatHistory,
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        temperature: 0.85,
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                heardText: { type: "STRING" },
                                mood: { type: "STRING" },
                                chinese: { type: "STRING" },
                                pinyin: { type: "STRING" },
                                english: { type: "STRING" },
                                mnemonic: { type: "STRING" },
                                nextReplies: {
                                    type: "ARRAY",
                                    items: { type: "STRING" }
                                },
                                newVocab: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            hz: { type: "STRING" },
                                            py: { type: "STRING" },
                                            en: { type: "STRING" }
                                        },
                                        propertyOrdering: ["hz", "py", "en"]
                                    }
                                },
                                bambooEarned: { type: "BOOLEAN" }
                            },
                            propertyOrdering: [
                                "heardText",
                                "mood",
                                "chinese",
                                "pinyin",
                                "english",
                                "mnemonic",
                                "nextReplies",
                                "newVocab",
                                "bambooEarned"
                            ]
                        }
                    }
                };

                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    throw new Error(`Gemini HTTP ${res.status}`);
                }

                const result = await res.json();
                const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                return extractJsonObject(rawJson);
            };

            // Smart AI Orchestrator: Routes across Custom Open Models, Gemini 3 Flash, and Zero-Key Open Cloud LLM
            const sendToAI = async ({ userText = '', audioBase64 = null, audioMimeType = 'audio/mp4', tempMsgId = null, scenarioOverride = null, modeOverride = null }) => {
                setIsLoading(true);
                const currentScen = scenarioOverride || activeScenario || SCENARIOS_DATA[0];
                const currentMode = modeOverride || conversationMode;
                const systemPrompt = buildSystemPrompt(currentScen, currentMode);
                const recentHistory = messages.slice(-10);

                let parsedResponse = null;
                let usedEngine = '';

                try {
                    const preset = OPEN_MODEL_PRESETS.find(p => p.id === selectedPresetId) || OPEN_MODEL_PRESETS[0];

                    // 1. If user explicitly chose an OpenRouter / OpenAI preset with key
                    if (preset.id !== 'auto' && customApiKey.trim()) {
                        parsedResponse = await callOpenAICompatibleModel({
                            endpointUrl: customEndpoint.trim() || preset.endpoint,
                            modelName: customModelName.trim() || preset.model,
                            bearerKey: customApiKey.trim(),
                            systemPrompt,
                            historyMessages: recentHistory,
                            userPromptText: userText || 'Hello!'
                        });
                        usedEngine = preset.name.split(':')[0];
                    } else {
                        // 2. Try Gemini 3 Flash first (works natively in Canvas or with Gemini API key)
                        try {
                            const effectiveGeminiKey = customApiKey.trim() || apiKey;
                            parsedResponse = await callGeminiModel({
                                geminiKey: effectiveGeminiKey,
                                systemPrompt,
                                historyMessages: recentHistory,
                                userPromptText: userText,
                                audioBase64,
                                audioMimeType
                            });
                            usedEngine = '⚡ Gemini 3 Flash';
                        } catch (geminiErr) {
                            // 3. Automatic Zero-Key Open Model Cloud Fallback (ideal when opened on iPad via Netlify/GitHub without a key!)
                            console.info("Switching to Zero-Key Open AI Cloud:", geminiErr.message);
                            parsedResponse = await callOpenAICompatibleModel({
                                endpointUrl: 'https://text.pollinations.ai/openai',
                                modelName: 'openai',
                                bearerKey: '',
                                systemPrompt,
                                historyMessages: recentHistory,
                                userPromptText: userText || 'Let\'s continue our Chinese adventure!'
                            });
                            usedEngine = '🌐 Open AI Cloud';
                        }
                    }
                } catch (allErr) {
                    console.warn("All cloud AI endpoints unreachable, using dynamic local response:", allErr);
                    usedEngine = '📴 Offline Backup';
                    const v = currentScen.vocab[Math.floor(Math.random() * currentScen.vocab.length)];
                    parsedResponse = {
                        heardText: userText || '你好!',
                        mood: '🐼',
                        chinese: `哇，你说得真有趣！在${currentScen.name}里，我刚刚看到了“${v.hz}”！你猜猜它会做什么？`,
                        pinyin: `Wā, nǐ shuō de zhēn yǒuqù! Zài ${currentScen.name} lǐ, wǒ gānggāng kàndào le "${v.py}"! Nǐ cāicai tā huì zuò shénme?`,
                        english: `Wow, what an interesting idea! Right here in ${currentScen.name}, I just spotted "${v.hz}" (${v.en})! What do you think happens next?`,
                        mnemonic: `💡 Spot Word: ${v.hz} (${v.py}) means ${v.en}! Tap the word to hear its tone.`,
                        nextReplies: [
                            `我也看到${v.hz}了! (I see ${v.en} too!)`,
                            `真好玩，再来一个谜语! (So fun, give me a riddle!)`,
                            `Teach me a funny new word! (教我一个新词!)`
                        ],
                        newVocab: [v],
                        bambooEarned: true
                    };
                }

                setActiveEngineLabel(usedEngine);

                if (tempMsgId) {
                    const finalTranscript = parsedResponse.heardText || userText || '🎤 (Spoke to teacher)';
                    setMessages(prev => prev.map(m => m.id === tempMsgId ? { ...m, text: finalTranscript } : m));
                }

                if (parsedResponse.mood) {
                    setTeacherMood(parsedResponse.mood);
                }

                if (parsedResponse.bambooEarned !== false) {
                    awardBamboo();
                }

                // Update Dynamic "Try Saying" Hints so every turn has fresh, relevant replies!
                if (Array.isArray(parsedResponse.nextReplies) && parsedResponse.nextReplies.length > 0) {
                    setDynamicHints(parsedResponse.nextReplies.slice(0, 4));
                }

                // Merge any newly taught vocabulary into the active vocab strip
                if (Array.isArray(parsedResponse.newVocab) && parsedResponse.newVocab.length > 0) {
                    setDynamicVocab(prev => {
                        const existingHz = new Set(prev.map(item => item.hz));
                        const additions = parsedResponse.newVocab.filter(item => item && item.hz && !existingHz.has(item.hz));
                        return [...additions, ...prev].slice(0, 8);
                    });
                }

                const newMsgId = 'msg-' + Date.now();
                setMessages(prev => [...prev, {
                    id: newMsgId,
                    role: 'ai',
                    mood: parsedResponse.mood || '🤩',
                    chinese: parsedResponse.chinese,
                    pinyin: parsedResponse.pinyin,
                    english: parsedResponse.english,
                    mnemonic: parsedResponse.mnemonic
                }]);

                if (parsedResponse.chinese) {
                    speakText(parsedResponse.chinese, newMsgId);
                }

                setIsLoading(false);
            };

            const cleanupMicrophone = () => {
                if (maxRecordTimerRef.current) {
                    clearTimeout(maxRecordTimerRef.current);
                    maxRecordTimerRef.current = null;
                }
                if (volumeIntervalRef.current) {
                    clearInterval(volumeIntervalRef.current);
                    volumeIntervalRef.current = null;
                }
                if (recognitionRef.current) {
                    try {
                        recognitionRef.current.onend = null;
                        recognitionRef.current.onerror = null;
                        recognitionRef.current.stop();
                    } catch (e) {}
                    recognitionRef.current = null;
                }
                if (mediaStreamRef.current) {
                    mediaStreamRef.current.getTracks().forEach(track => track.stop());
                    mediaStreamRef.current = null;
                }
                if (audioContextRef.current) {
                    try {
                        audioContextRef.current.close();
                    } catch (e) {}
                    audioContextRef.current = null;
                }
                setMicVolume(0);
            };

            const blobToBase64 = (blob) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const dataUrl = reader.result || '';
                        const base64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : '';
                        resolve(base64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            };

            const stopRecordingAndSend = () => {
                if (!isRecording) return;
                setIsRecording(false);

                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    try {
                        mediaRecorderRef.current.stop();
                        return;
                    } catch (e) {}
                }

                const capturedText = (liveTranscriptRef.current || '').trim();
                cleanupMicrophone();
                setLiveTranscript('');
                liveTranscriptRef.current = '';

                if (capturedText) {
                    const userMsgId = 'usr-' + Date.now();
                    setMessages(prev => [...prev, { id: userMsgId, role: 'user', text: capturedText }]);
                    sendToAI({ userText: capturedText });
                } else {
                    setMicError('No voice was detected. Try speaking closer to the microphone, or tap any blue phrase chip below!');
                }
            };

            const handleMicToggle = async () => {
                if (isRecording) {
                    stopRecordingAndSend();
                    return;
                }

                stopSpeaking();
                unlockAudioForIOS();
                setMicError(null);
                setLiveTranscript('');
                liveTranscriptRef.current = '';

                if (window.location.protocol === 'file:') {
                    setMicError('iPad Safari blocks the microphone when opened directly as a local file (file://). Please use HTTPS (like Netlify Drop) or use the text/phrase buttons below!');
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

                const startParallelSpeechRecognition = (standaloneMode = false) => {
                    if (!SpeechRecognition) return false;
                    try {
                        const recognition = new SpeechRecognition();
                        recognition.lang = micLang;
                        recognition.interimResults = true;
                        recognition.continuous = true;
                        recognition.maxAlternatives = 1;

                        recognition.onresult = (event) => {
                            let combined = '';
                            for (let i = 0; i < event.results.length; i++) {
                                combined += event.results[i][0].transcript;
                            }
                            if (combined.trim()) {
                                liveTranscriptRef.current = combined.trim();
                                setLiveTranscript(combined.trim());
                            }
                        };

                        recognition.onerror = (event) => {
                            if (standaloneMode) {
                                setIsRecording(false);
                                cleanupMicrophone();
                                setMicError(`Voice recognition (${event.error}) paused. Try speaking again or tap a phrase below!`);
                            }
                        };

                        recognition.onend = () => {
                            if (standaloneMode && recognitionRef.current) {
                                const text = (liveTranscriptRef.current || '').trim();
                                setIsRecording(false);
                                cleanupMicrophone();
                                setLiveTranscript('');
                                liveTranscriptRef.current = '';
                                if (text) {
                                    setMessages(prev => [...prev, { id: 'usr-' + Date.now(), role: 'user', text }]);
                                    sendToAI({ userText: text });
                                }
                            }
                        };

                        recognitionRef.current = recognition;
                        recognition.start();
                        return true;
                    } catch (e) {
                        return false;
                    }
                };

                if (hasMediaDevices && window.MediaRecorder) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            }
                        });

                        mediaStreamRef.current = stream;
                        setIsRecording(true);

                        try {
                            const AudioCtx = window.AudioContext || window.webkitAudioContext;
                            const audioCtx = new AudioCtx();
                            audioContextRef.current = audioCtx;
                            const source = audioCtx.createMediaStreamSource(stream);
                            const analyser = audioCtx.createAnalyser();
                            analyser.fftSize = 256;
                            source.connect(analyser);

                            const dataArray = new Uint8Array(analyser.frequencyBinCount);
                            let hasSpoken = false;
                            let silentFrames = 0;

                            volumeIntervalRef.current = setInterval(() => {
                                analyser.getByteFrequencyData(dataArray);
                                let sum = 0;
                                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                                const avg = sum / dataArray.length;
                                const normalized = Math.min(100, Math.round((avg / 65) * 100));
                                setMicVolume(normalized);

                                if (normalized > 18) {
                                    hasSpoken = true;
                                    silentFrames = 0;
                                } else if (hasSpoken) {
                                    silentFrames += 1;
                                    if (silentFrames >= 18 && mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                                        try {
                                            mediaRecorderRef.current.stop();
                                        } catch (e) {}
                                    }
                                }
                            }, 100);
                        } catch (audioErr) {}

                        const preferredTypes = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
                        let selectedMime = '';
                        for (const t of preferredTypes) {
                            if (window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(t)) {
                                selectedMime = t;
                                break;
                            }
                        }

                        const recorder = selectedMime
                            ? new MediaRecorder(stream, { mimeType: selectedMime })
                            : new MediaRecorder(stream);

                        audioChunksRef.current = [];
                        mediaRecorderRef.current = recorder;

                        recorder.ondataavailable = (e) => {
                            if (e.data && e.data.size > 0) {
                                audioChunksRef.current.push(e.data);
                            }
                        };

                        recorder.onstop = async () => {
                            const draftText = (liveTranscriptRef.current || '').trim();
                            const actualMime = (recorder.mimeType || selectedMime || 'audio/mp4').split(';')[0];
                            const audioBlob = new Blob(audioChunksRef.current, { type: actualMime });

                            setIsRecording(false);
                            cleanupMicrophone();
                            setLiveTranscript('');
                            liveTranscriptRef.current = '';

                            if (audioBlob.size < 400 && !draftText) {
                                setMicError('Recording was too short. Tap the mic, speak your phrase, and tap Stop!');
                                return;
                            }

                            const tempId = 'usr-' + Date.now();
                            setMessages(prev => [
                                ...prev,
                                { id: tempId, role: 'user', text: draftText || '🎤 Speaking to teacher...' }
                            ]);

                            try {
                                const base64Audio = await blobToBase64(audioBlob);
                                await sendToAI({
                                    userText: draftText,

                            )}

                            {isRecording && (
                                <div className="w-full mb-2 bg-rose-50 border-2 border-rose-200 rounded-xl px-3 py-1.5 flex items-center justify-between pop-in">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                                        <span className="text-xs font-black text-rose-700 truncate max-w-[210px] sm:max-w-xs">
                                            {liveTranscript ? `"${liveTranscript}"` : 'Listening... Speak & tap Stop when done!'}
                                        </span>
                                    </div>
                                    <div className="flex items-end gap-1 h-4">
                                        {[0.4, 0.7, 1.0, 0.8, 0.5].map((mult, idx) => {
                                            const barHeight = Math.max(4, Math.min(16, Math.round((micVolume * mult) / 5)));
                                            return (
                                                <div
                                                    key={idx}
                                                    style={{ height: `${barHeight}px` }}
                                                    className="w-1 bg-rose-500 rounded-full transition-all duration-75"
                                                ></div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            <div className="w-full flex items-center gap-2">
                                {/* Mic Recognition Language Toggle */}
                                <button
                                    type="button"
                                    onClick={() => setMicLang(prev => prev === 'zh-CN' ? 'en-SG' : 'zh-CN')}
                                    className="flex-shrink-0 bg-pink-50 hover:bg-pink-100 text-pink-700 border-2 border-pink-200 rounded-2xl px-2.5 py-2 text-xs font-black flex flex-col items-center justify-center shadow-sm active:scale-95 transition-transform"
                                    title="Switch primary listening language"
                                >
                                    <span className="text-[9px] text-gray-400 uppercase">Mic Mode</span>
                                    <span>{micLang === 'zh-CN' ? '🇨🇳 中文+EN' : '🇸🇬 EN+中文'}</span>
                                </button>

                                {/* Giant Tap-to-Talk / Tap-to-Stop Microphone Button */}
                                <button 
                                    type="button"
                                    onClick={handleMicToggle}
                                    disabled={isLoading}
                                    className={`flex-shrink-0 w-14 h-14 rounded-full flex flex-col items-center justify-center shadow-lg transition-all duration-200 active:scale-90 border-4 border-white ${
                                        isRecording
                                            ? 'bg-red-500 text-white animate-pulse shadow-red-300'
                                            : 'bg-gradient-to-br from-pink-500 to-rose-500 text-white shadow-pink-200 hover:from-pink-600 hover:to-rose-600'
                                    } ${isLoading ? 'opacity-50 cursor-not-allowed' : ''}`}
                                >
                                    <i className={`fa-solid ${isRecording ? 'fa-stop text-lg' : 'fa-microphone text-xl'}`}></i>
                                    <span className="text-[8px] font-black uppercase tracking-wider mt-0.5">
                                        {isRecording ? 'Stop' : 'Speak'}
                                    </span>
                                </button>

                                {/* Free-Form Type-to-Talk Input */}
                                <form onSubmit={handleTextSubmit} className="flex-1 flex items-center gap-1.5">
                                    <input
                                        type="text"
                                        value={textInput}
                                        onChange={(e) => setTextInput(e.target.value)}
                                        placeholder={`Ask ${teacherName} anything in EN or 中文...`}
                                        disabled={isLoading}
                                        className="w-full px-3.5 py-2.5 rounded-2xl border-2 border-pink-200 bg-white/95 text-sm font-bold text-gray-700 focus:outline-none focus:border-pink-400 shadow-inner"
                                    />
                                    <button
                                        type="submit"
                                        disabled={!textInput.trim() || isLoading}
                                        className="flex-shrink-0 bg-pink-500 hover:bg-pink-600 disabled:bg-pink-200 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-sm transition-colors active:scale-95"
                                        aria-label="Send message"
                                    >
                                        <i className="fa-solid fa-paper-plane text-sm"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
